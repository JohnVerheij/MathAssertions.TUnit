name: CodeQL

# No path filters: CodeQL analyzes every change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-codeql.yml@a41642e9c024448adeaa656e1dc3565df76aad38 # feat/net11-leg
    permissions:
      contents: read           # checkout + build
      security-events: write   # upload CodeQL results to code scanning
      actions: read            # read workflow run metadata during analysis
