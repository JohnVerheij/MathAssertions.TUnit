name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-docs.yml@a41642e9c024448adeaa656e1dc3565df76aad38 # feat/net11-leg
    with:
      package: MathAssertions
    permissions:
      contents: read    # checkout and build
      pages: write      # publish the site to GitHub Pages
      id-token: write   # the Pages deployment authenticates with an OIDC token
