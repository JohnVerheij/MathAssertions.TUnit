name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-docs.yml@f70f060b63f0d03b6aaa9d655050283771cc330a # v1.4.0-trial
    with:
      package: MathAssertions
    permissions:
      contents: read    # checkout and build
      pages: write      # publish the site to GitHub Pages
      id-token: write   # the Pages deployment authenticates with an OIDC token
