name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-zizmor.yml@a41642e9c024448adeaa656e1dc3565df76aad38 # feat/net11-leg
    permissions:
      contents: read   # checkout only
      actions: read    # zizmor reads workflow metadata of the repository
