name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-zizmor.yml@f70f060b63f0d03b6aaa9d655050283771cc330a # v1.4.0-trial
    permissions:
      contents: read   # checkout only
      actions: read    # zizmor reads workflow metadata of the repository
